services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - internal

  backend:
    # Образ собирает GitHub Actions, сервер только скачивает: сборка здесь
    # занимала больше двадцати минут на одном ядре, и всё это время сервер
    # почти не отвечал. Обновление подхватывает deploy/auto-update.sh.
    image: ghcr.io/tigo929/racpechatca-backend:latest
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://crm_user:${DB_PASSWORD}@postgres:5432/crm
      JWT_SECRET: ${JWT_SECRET}
      CRM_LEAD_TOKEN: ${CRM_LEAD_TOKEN}
      # Подпись заявок с сайта: секрет и жёсткий режим (см. .env.example).
      CRM_LEAD_SIGNING_SECRET: ${CRM_LEAD_SIGNING_SECRET:-}
      CRM_LEAD_REQUIRE_SIGNATURE: ${CRM_LEAD_REQUIRE_SIGNATURE:-false}
      JWT_EXPIRES_IN: 7d
      # Источники, которым разрешён CORS (через запятую). Сейчас фронт ходит
      # через nginx того же домена и CORS не задействован, но при выносе
      # панели на отдельный адрес переменную нужно заполнить. Звёздочка не
      # поддерживается: с ней чужой сайт дёргал бы CRM из браузера сотрудника.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      PORT: 3000
      # Бизнес живёт по Москве: без TZ отчёты режут месяцы/недели по UTC,
      # и заказ, отправленный 1-го числа ночью, попадал в прошлый месяц.
      TZ: Europe/Moscow
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_GROUP_CHAT_ID: ${TELEGRAM_GROUP_CHAT_ID}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      # Напоминания об отзывах — в отдельный чат/тему форума. Если пусто —
      # уходят в общую группу (TELEGRAM_GROUP_CHAT_ID).
      TELEGRAM_REVIEW_CHAT_ID: ${TELEGRAM_REVIEW_CHAT_ID:-}
      TELEGRAM_REVIEW_THREAD_ID: ${TELEGRAM_REVIEW_THREAD_ID:-}
      # Интеграция с исполнителем-партнёром (см. docs/partner-integration.md)
      TSHIRT_PARTNER_TELEGRAM_CHAT_ID: ${TSHIRT_PARTNER_TELEGRAM_CHAT_ID:-}
      TSHIRT_PARTNER_TELEGRAM_THREAD_ID: ${TSHIRT_PARTNER_TELEGRAM_THREAD_ID:-}
      PARTNER_WEBHOOK_ENABLED: ${PARTNER_WEBHOOK_ENABLED:-false}
      PARTNER_WEBHOOK_URL: ${PARTNER_WEBHOOK_URL:-}
      PARTNER_WEBHOOK_TOKEN: ${PARTNER_WEBHOOK_TOKEN:-}
      PARTNER_STATUS_POLL_ENABLED: ${PARTNER_STATUS_POLL_ENABLED:-false}
      PARTNER_API_TOKEN: ${PARTNER_API_TOKEN:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      # Avito API. Пусто — клиент просто не настроен и молчит; на работу CRM
      # это не влияет (проверяется в AvitoService при первом обращении).
      AVITO_CLIENT_ID: ${AVITO_CLIENT_ID:-}
      AVITO_CLIENT_SECRET: ${AVITO_CLIENT_SECRET:-}
      AVITO_MESSENGER_POLLING_ENABLED: ${AVITO_MESSENGER_POLLING_ENABLED:-true}
      AVITO_MESSENGER_POLLING_INTERVAL_MS: ${AVITO_MESSENGER_POLLING_INTERVAL_MS:-60000}
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    extra_hosts:
      - "api.telegram.org:149.154.167.220"
    networks:
      - internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:3000/health >/dev/null || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
    command: >
      sh -c "npx prisma migrate deploy && node dist/src/main"

  frontend:
    # Собирается из исходников в CI. Раньше образ делался из готового dist,
    # которого нет в git, — панель приходилось собирать локально и заливать
    # на сервер отдельным скриптом.
    image: ghcr.io/tigo929/racpechatca-frontend:latest
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
      # Сайт photo.* обслуживается этим же nginx: он единственный вход на
      # 80/443. Монтируем, а не пересобираем образ — сборка на этом сервере
      # опасна по памяти, а правка конфига должна стоить один reload.
      - ./frontend/nginx-photo.conf:/etc/nginx/conf.d/photo.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - internal

volumes:
  pgdata:
  # ТЗ-фото (согласованные макеты) бэкенд пишет в /app/uploads. Том объявлен
  # здесь — иначе docker compose не парсит проект (backend ссылается на uploads).
  uploads:

networks:
  internal:
