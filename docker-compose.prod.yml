services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - internal

  backend:
    build:
      context: ./crm-new
      dockerfile: Dockerfile.prebuilt
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://crm_user:${DB_PASSWORD}@postgres:5432/crm
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 7d
      PORT: 3000
      # Бизнес живёт по Москве: без TZ отчёты режут месяцы/недели по UTC,
      # и заказ, отправленный 1-го числа ночью, попадал в прошлый месяц.
      TZ: Europe/Moscow
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_GROUP_CHAT_ID: ${TELEGRAM_GROUP_CHAT_ID}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      # Напоминания об отзывах — в отдельный чат/тему форума. Если пусто —
      # уходят в общую группу (TELEGRAM_GROUP_CHAT_ID).
      TELEGRAM_REVIEW_CHAT_ID: ${TELEGRAM_REVIEW_CHAT_ID:-}
      TELEGRAM_REVIEW_THREAD_ID: ${TELEGRAM_REVIEW_THREAD_ID:-}
      # Интеграция с исполнителем-партнёром (см. docs/partner-integration.md)
      TSHIRT_PARTNER_TELEGRAM_CHAT_ID: ${TSHIRT_PARTNER_TELEGRAM_CHAT_ID:-}
      TSHIRT_PARTNER_TELEGRAM_THREAD_ID: ${TSHIRT_PARTNER_TELEGRAM_THREAD_ID:-}
      PARTNER_WEBHOOK_ENABLED: ${PARTNER_WEBHOOK_ENABLED:-false}
      PARTNER_WEBHOOK_URL: ${PARTNER_WEBHOOK_URL:-}
      PARTNER_WEBHOOK_TOKEN: ${PARTNER_WEBHOOK_TOKEN:-}
      PARTNER_STATUS_POLL_ENABLED: ${PARTNER_STATUS_POLL_ENABLED:-false}
      PARTNER_API_TOKEN: ${PARTNER_API_TOKEN:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      # Асинхронная передача заказов в Gulian CRM через transactional outbox.
      GULIAN_INTEGRATION_ENABLED: ${GULIAN_INTEGRATION_ENABLED:-false}
      GULIAN_INTEGRATION_BASE_URL: ${GULIAN_INTEGRATION_BASE_URL:-}
      GULIAN_INTEGRATION_SECRET: ${GULIAN_INTEGRATION_SECRET:-}
      GULIAN_INTEGRATION_TIMEOUT_SECONDS: ${GULIAN_INTEGRATION_TIMEOUT_SECONDS:-15}
      GULIAN_INTEGRATION_MAX_ATTEMPTS: ${GULIAN_INTEGRATION_MAX_ATTEMPTS:-20}
      GULIAN_INTEGRATION_BULK_SIZE: ${GULIAN_INTEGRATION_BULK_SIZE:-100}
      GULIAN_INTEGRATION_SCAN_INTERVAL_SECONDS: ${GULIAN_INTEGRATION_SCAN_INTERVAL_SECONDS:-10}      # Avito API. Пусто — клиент просто не настроен и молчит; на работу CRM
      # это не влияет (проверяется в AvitoService при первом обращении).
      AVITO_CLIENT_ID: ${AVITO_CLIENT_ID:-}
      AVITO_CLIENT_SECRET: ${AVITO_CLIENT_SECRET:-}
      AVITO_MESSENGER_POLLING_ENABLED: ${AVITO_MESSENGER_POLLING_ENABLED:-true}
      AVITO_MESSENGER_POLLING_INTERVAL_MS: ${AVITO_MESSENGER_POLLING_INTERVAL_MS:-60000}
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    extra_hosts:
      - "api.telegram.org:149.154.167.220"
    networks:
      - internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:3000/health >/dev/null || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
    command: >
      sh -c "npx prisma migrate deploy && node dist/src/main"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prebuilt
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - internal

volumes:
  pgdata:
  # ТЗ-фото (согласованные макеты) бэкенд пишет в /app/uploads. Том объявлен
  # здесь — иначе docker compose не парсит проект (backend ссылается на uploads).
  uploads:

networks:
  internal:

