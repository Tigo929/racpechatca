# Сайт фотопечати на том же nginx, что обслуживает CRM.
#
# Кладётся на сервер в /opt/raspechatka/frontend/nginx-photo.conf и
# монтируется в контейнер frontend как /etc/nginx/conf.d/photo.conf
# (nginx подхватывает все *.conf в conf.d). Монтирование, а не пересборка
# образа: сборка на этом сервере опасна по памяти, а правка конфига
# должна стоить один restart.
#
# ВАЖНО: подключать этот файл только ПОСЛЕ выпуска сертификата.
# Без файлов сертификата nginx не стартует и уронит вместе с собой CRM.

server {
    listen 80;
    server_name photo.195-2-75-249.sslip.io;

    # Проверка владения доменом при выпуске и продлении сертификата.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Свой редирект: общий блок CRM уводит на её домен, а нам нужен свой.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name photo.195-2-75-249.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/photo.195-2-75-249.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/photo.195-2-75-249.sslip.io/privkey.pem;

    # К заявке можно приложить до 200 МБ фотографий (UPLOAD_RULES в
    # packages/shared). Лимит CRM (30 МБ) здесь не подходит: nginx отбивал бы
    # большие заказы кодом 413 ещё до приложения, и клиент видел бы просто
    # «ошибка отправки». Запас сверху — на служебные поля формы.
    client_max_body_size 210m;

    # Большой заказ клиент грузит с телефона по мобильной сети — дефолтных
    # 60 секунд не хватает, загрузка обрывалась бы на середине.
    proxy_read_timeout    300s;
    proxy_send_timeout    300s;
    proxy_request_buffering off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    location / {
        proxy_pass         http://photo-web:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        # Next.js отдаёт часть ответов потоком; буферизация ломает их порядок.
        proxy_buffering    off;
    }
}
