# Сайт фотопечати на том же nginx, что обслуживает CRM.
#
# Кладётся на сервер в /opt/raspechatka/frontend/nginx-photo.conf и
# монтируется в контейнер frontend как /etc/nginx/conf.d/photo.conf
# (nginx подхватывает все *.conf в conf.d). Монтирование, а не пересборка
# образа: сборка на этом сервере опасна по памяти, а правка конфига
# должна стоить один restart.
#
# ВАЖНО: подключать этот файл только ПОСЛЕ выпуска сертификата.
# Без файлов сертификата nginx не стартует и уронит вместе с собой CRM.

server {
    listen 80;
    server_name photo.195-2-75-249.sslip.io;

    # Проверка владения доменом при выпуске и продлении сертификата.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Свой редирект: общий блок CRM уводит на её домен, а нам нужен свой.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name photo.195-2-75-249.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/photo.195-2-75-249.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/photo.195-2-75-249.sslip.io/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    # Вместо X-Frame-Options — frame-ancestors. Задача та же: чужой сайт
    # не может показать наши страницы у себя во фрейме (защита от
    # клик-джекинга, у нас по этому адресу живёт /admin). Но X-Frame-Options
    # умеет только «никому» или «только себе», а Метрике нужно показывать
    # страницу во фрейме для карт кликов, карты скролла и Вебвизора —
    # без этого они отвечают «Установлен запрет на отображение во фрейме».
    # Список доменов — официальный из справки Метрики (install-counter-csp)
    # плюс webvisor.com, куда отправляет сама ошибка. Директива одна,
    # frame-ancestors: скрипты и стили она не трогает — директивы,
    # которых в политике нет, не ограничиваются.
    add_header Content-Security-Policy   "frame-ancestors 'self' https://metrika.yandex.ru https://metrika.yandex.com https://metrika.yandex.by https://metrika.yandex.com.tr https://metrika.yandex.kz https://metrika.yandex.uz https://metrika.yandex https://metrika.ya.ru https://metrica.yandex.ru https://metrica.yandex.com https://metrica.yandex.by https://metrica.yandex.com.tr https://metrica.yandex.kz https://metrica.yandex https://metrica.ya.ru https://analytics.yandex.ru https://analytics.yandex.com https://analytics.yandex.by https://analytics.yandex.com.tr https://analytics.yandex.kz https://metr.yandex.ru https://metr.yandex.com https://metr.yandex.by https://metr.yandex.com.tr https://metr.yandex.kz https://webvisor.com https://*.webvisor.com" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    # К заявке можно приложить до 200 МБ фотографий (UPLOAD_RULES в
    # packages/shared). Лимит CRM (30 МБ) здесь не подходит: nginx отбивал бы
    # большие заказы кодом 413 ещё до приложения, и клиент видел бы просто
    # «ошибка отправки». Запас сверху — на служебные поля формы.
    # Потолок одного запроса. Фотографии едут по одной и в 210 МБ укладывались,
    # но подборку приносят одним zip, и архив на гигабайт упирался в предел
    # молча. Место на диске сторожится отдельно, по свободному месту.
    client_max_body_size 20g;

    # Большой заказ клиент грузит с телефона по мобильной сети — дефолтных
    # 60 секунд не хватает, загрузка обрывалась бы на середине.
    proxy_read_timeout    300s;
    proxy_send_timeout    300s;
    proxy_request_buffering off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    location / {
        proxy_pass         http://photo-web:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        # Next.js отдаёт часть ответов потоком; буферизация ломает их порядок.
        proxy_buffering    off;
    }
}

# Основной домен бизнеса. В продакшене публичный сайт живёт на корне домена,
# а рабочая CRM спрятана в отдельной зоне /crm.
server {
    listen 80;
    server_name raspechatkaa.ru www.raspechatkaa.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://raspechatkaa.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.raspechatkaa.ru;

    ssl_certificate     /etc/letsencrypt/live/raspechatkaa.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/raspechatkaa.ru/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    # Вместо X-Frame-Options — frame-ancestors. Задача та же: чужой сайт
    # не может показать наши страницы у себя во фрейме (защита от
    # клик-джекинга, у нас по этому адресу живёт /admin). Но X-Frame-Options
    # умеет только «никому» или «только себе», а Метрике нужно показывать
    # страницу во фрейме для карт кликов, карты скролла и Вебвизора —
    # без этого они отвечают «Установлен запрет на отображение во фрейме».
    # Список доменов — официальный из справки Метрики (install-counter-csp)
    # плюс webvisor.com, куда отправляет сама ошибка. Директива одна,
    # frame-ancestors: скрипты и стили она не трогает — директивы,
    # которых в политике нет, не ограничиваются.
    add_header Content-Security-Policy   "frame-ancestors 'self' https://metrika.yandex.ru https://metrika.yandex.com https://metrika.yandex.by https://metrika.yandex.com.tr https://metrika.yandex.kz https://metrika.yandex.uz https://metrika.yandex https://metrika.ya.ru https://metrica.yandex.ru https://metrica.yandex.com https://metrica.yandex.by https://metrica.yandex.com.tr https://metrica.yandex.kz https://metrica.yandex https://metrica.ya.ru https://analytics.yandex.ru https://analytics.yandex.com https://analytics.yandex.by https://analytics.yandex.com.tr https://analytics.yandex.kz https://metr.yandex.ru https://metr.yandex.com https://metr.yandex.by https://metr.yandex.com.tr https://metr.yandex.kz https://webvisor.com https://*.webvisor.com" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    return 301 https://raspechatkaa.ru$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name raspechatkaa.ru;

    ssl_certificate     /etc/letsencrypt/live/raspechatkaa.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/raspechatkaa.ru/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    # Вместо X-Frame-Options — frame-ancestors. Задача та же: чужой сайт
    # не может показать наши страницы у себя во фрейме (защита от
    # клик-джекинга, у нас по этому адресу живёт /admin). Но X-Frame-Options
    # умеет только «никому» или «только себе», а Метрике нужно показывать
    # страницу во фрейме для карт кликов, карты скролла и Вебвизора —
    # без этого они отвечают «Установлен запрет на отображение во фрейме».
    # Список доменов — официальный из справки Метрики (install-counter-csp)
    # плюс webvisor.com, куда отправляет сама ошибка. Директива одна,
    # frame-ancestors: скрипты и стили она не трогает — директивы,
    # которых в политике нет, не ограничиваются.
    add_header Content-Security-Policy   "frame-ancestors 'self' https://metrika.yandex.ru https://metrika.yandex.com https://metrika.yandex.by https://metrika.yandex.com.tr https://metrika.yandex.kz https://metrika.yandex.uz https://metrika.yandex https://metrika.ya.ru https://metrica.yandex.ru https://metrica.yandex.com https://metrica.yandex.by https://metrica.yandex.com.tr https://metrica.yandex.kz https://metrica.yandex https://metrica.ya.ru https://analytics.yandex.ru https://analytics.yandex.com https://analytics.yandex.by https://analytics.yandex.com.tr https://analytics.yandex.kz https://metr.yandex.ru https://metr.yandex.com https://metr.yandex.by https://metr.yandex.com.tr https://metr.yandex.kz https://webvisor.com https://*.webvisor.com" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    root /usr/share/nginx/html;
    index index.html;

    # Потолок одного запроса. Фотографии едут по одной и в 210 МБ укладывались,
    # но подборку приносят одним zip, и архив на гигабайт упирался в предел
    # молча. Место на диске сторожится отдельно, по свободному месту.
    client_max_body_size 20g;
    proxy_read_timeout    300s;
    proxy_send_timeout    300s;
    proxy_request_buffering off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # CRM остаётся доступной только через специальную зону /crm.
    location = /crm {
        return 302 /crm/photo;
    }

    location = /crm/ {
        return 302 /crm/photo;
    }

    location ^~ /crm/ {
        try_files $uri $uri/ /index.html;
    }

    # Vite-ассеты CRM грузятся из корня /assets, даже когда пользователь
    # находится на /crm/photo. У публичного сайта Next.js ассеты лежат в /_next.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # API CRM оставляем на прежних путях, потому что фронтенд панели уже
    # обращается к ним как к /auth, /order-photo и т.п.
    location ~ ^/(health|order-photo|auth|avito|users|salary|reports|expenses|stock|partner|tasks|telegram|scenarios|marketplace|canvas|approvals|mockup-templates|analytics|ai) {
        proxy_pass         http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    # Всё остальное — публичный сайт фотопечати.
    location / {
        proxy_pass         http://photo-web:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_buffering    off;
    }
}
