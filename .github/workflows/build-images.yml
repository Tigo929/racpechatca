# Сборка образов CRM на стороне GitHub, а не на сервере.
#
# Почему так: на сервере одно ядро и 1.6 ГБ памяти, и сборка бэкенда там
# занимает больше двадцати минут, всё это время SSH почти не отвечает.
# Ровно то же ограничение уже осознано в web-photo — приводим CRM к нему же.
#
# Побочная выгода: фронтенд собирается из исходников, а не из готового dist.
# Раньше dist в git не хранился, поэтому фронт собирали локально и заливали
# на сервер отдельным скриптом — источник правды был вне репозитория.

name: Сборка образов

on:
  push:
    # Только master. Раньше здесь была ещё feature/site-lead-paper — её
    # нужно было выкатить раньше сайта. Обе ветки собирались в один тег
    # `:latest`, и это вышло боком: master развивался параллельно, его
    # сборка легла поверх ветки, и прод несколько дней работал без её
    # кода — с прайсом на холст из шести заглушек вместо сорока шести
    # настоящих размеров, втрое дороже. Заметили это только глазами.
    #
    # Ветка влита, и обратно её в список добавлять нельзя: пуш в неё
    # опять перезаписал бы прод кодом до слияния. Нужна выкатка с ветки —
    # заводите ей отдельный тег, а не общий `:latest`.
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # Тесты идут до сборки: сломанный код не должен доехать до реестра,
  # откуда сервер заберёт его автоматически.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 22 — как в Dockerfile. На 24 падает prisma generate.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crm-new/package-lock.json

      - name: Зависимости
        working-directory: crm-new
        run: npm ci

      # Без клиента Prisma не компилируются типы — генерируем до тестов.
      - name: Клиент Prisma
        working-directory: crm-new
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://crm_user:crm_password@localhost:5432/crm

      - name: Тесты бэкенда
        working-directory: crm-new
        run: npm test

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Сборка панели
        working-directory: frontend
        run: npm ci && npm run build

      # vitest + testing-library: пока только дашборд аналитики (этап 09).
      - name: Тесты панели
        working-directory: frontend
        run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # Образы независимы: поломка одного не должна прятать ошибку второго.
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: crm-new
            dockerfile: crm-new/Dockerfile.prebuilt
          - name: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4

      # Docker требует имя образа строчными, а логин может быть с заглавными
      # (Tigo929) — без приведения сборка падает на теге.
      - name: Владелец репозитория в нижнем регистре
        id: owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Метки образа (этап 13, разделы 18 и 20). Всегда — неизменяемая метка
      # по хешу коммита. Метки `production` и `latest` получает ТОЛЬКО сборка
      # с master: условие проверяется по фактической ветке запуска, а не по
      # содержимому этого файла, поэтому копия workflow в чужой ветке не сможет
      # выпустить production-образ, даже если её кто-то запушит. Сервер
      # (deploy/auto-update.sh, docker-compose.prod.yml) забирает `:production`;
      # `latest` остаётся на переходный период и источником правды не является.
      - name: Метки образа
        id: tags
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/racpechatca-${{ matrix.name }}
        run: |
          tags="$IMAGE:${{ github.sha }}"
          if [ "${{ github.ref }}" = "refs/heads/master" ]; then
            tags="$tags,$IMAGE:production,$IMAGE:latest"
          fi
          echo "value=$tags" >> "$GITHUB_OUTPUT"
          echo "Метки: $tags"

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.tags.outputs.value }}
          # Хеш коммита внутрь образа: /health отвечает им (build), а метка
          # revision позволяет сверить запущенный контейнер с образом.
          build-args: |
            BUILD_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
